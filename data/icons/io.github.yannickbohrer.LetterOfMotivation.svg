<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A sheet of paper with a page-fill gauge on its right edge and a signature in ink blue. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0c6cf"/>
      <stop offset="1" stop-color="#9aa2ad"/>
    </linearGradient>
  </defs>
  <!-- sheet thickness -->
  <rect x="22" y="14" width="76" height="104" rx="6" fill="url(#edge)"/>
  <!-- sheet -->
  <rect x="22" y="10" width="76" height="104" rx="6" fill="#ffffff"/>
  <rect x="22.5" y="10.5" width="75" height="103" rx="5.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <!-- address and text lines -->
  <g fill="#3d4450">
    <rect x="32" y="22" width="26" height="3" rx="1.5"/>
    <rect x="32" y="28" width="20" height="3" rx="1.5"/>
    <rect x="32" y="44" width="38" height="3.5" rx="1.75"/>
  </g>
  <g fill="#9aa2ad">
    <rect x="32" y="54" width="54" height="3" rx="1.5"/>
    <rect x="32" y="60" width="54" height="3" rx="1.5"/>
    <rect x="32" y="66" width="46" height="3" rx="1.5"/>
    <rect x="32" y="74" width="54" height="3" rx="1.5"/>
    <rect x="32" y="80" width="38" height="3" rx="1.5"/>
  </g>
  <!-- signature -->
  <path d="M33 101c4-7 7-11 9-9s-3 9 1 8 6-9 9-8-1 7 3 6 8-5 13-6" fill="none" stroke="#24418f"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- page-fill gauge: track and fill -->
  <rect x="104" y="18" width="6" height="88" rx="3" fill="#24418f" fill-opacity="0.18"/>
  <rect x="104" y="18" width="6" height="74" rx="3" fill="#24418f"/>
</svg>
